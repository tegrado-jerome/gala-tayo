    <!-- Fix cascade-layer order before any stylesheet loads; a lazy chunk declaring `components` first would let the reset beat the kit. -->
    <style>@layer properties, theme, base, components, utilities;</style>
    <script>
      (function () {
        var p = (location.pathname.replace(/\/+$/, '') || '/');
        if (p === '/') {
          document.documentElement.dataset.initialRoute = 'welcome';
          window.__galatayoWelcomeStart = Date.now();
          window.__galatayoWelcomeStartUsed = false;
        } else {
          document.documentElement.dataset.suppressLoader = 'true';
        }
      })();
    </script>

    <style>
      html, body, #root {
        min-height: 100vh;
      }

      html, body, #root {
        background: #ffffff;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #0b1626;
      }

      .critical-app-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #14343b;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 560ms ease, visibility 560ms ease;
      }

      html[data-suppress-loader] .critical-app-loader {
        display: none !important;
      }

      .critical-app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .critical-app-loader__logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font: 700 34px/1 'Outfit', system-ui, sans-serif;
        letter-spacing: -0.04em;
        animation: critical-logo-breathe 2.4s ease-in-out infinite;
      }

      @keyframes critical-logo-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      @media (prefers-reduced-motion: reduce) {
        .critical-app-loader__logo { animation: none; }
      }
    </style>
    <script>
      (function () {
        function normalizeThemeRoutePath(pathname) {
          return pathname.replace(/\/+$/, '') || '/';
        }

        function isForcedLightThemePath(pathname) {
          return normalizeThemeRoutePath(pathname) === '/';
        }

        try {
          var isForcedLightRoute = isForcedLightThemePath(window.location.pathname || '/');
          var storedPreference = localStorage.getItem('galatayo:theme-preference');
          var preference = storedPreference === 'dark' ? 'dark' : 'light';
          var resolvedTheme = isForcedLightRoute ? 'light' : preference;
          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="critical-welcome-loader" class="critical-app-loader" aria-label="Loading GalaTayo">
      <span class="critical-app-loader__logo" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#14343b"/><path d="M20 35a12 12 0 0 1 24 0Z" fill="#ff7a1a"/><rect x="12" y="38" width="40" height="4" rx="2" fill="#fff"/><rect x="19" y="45.5" width="26" height="4" rx="2" fill="#fff" opacity=".75"/><rect x="26" y="53" width="12" height="4" rx="2" fill="#fff" opacity=".5"/></svg>galatayo</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var isWelcome = (location.pathname.replace(/\/+$/, '') || '/') === '/';
        if (!isWelcome) return;

        var MIN_WELCOME_MS = 600;
        var MAX_FALLBACK_MS = 10000;
        var start = window.__galatayoWelcomeStart || Date.now();
        var isReady = false;
        var intervalId = 0;
        var fallbackId = 0;

        function hideLoader() {
          var loader = document.getElementById('critical-welcome-loader');
          if (loader && !loader.classList.contains('is-hidden')) {
            loader.classList.add('is-hidden');
          }
        }

        function canHideLoader() {
          return isReady && (Date.now() - start >= MIN_WELCOME_MS);
        }

        function tryHideLoader() {
          if (canHideLoader()) {
            window.clearInterval(intervalId);
            window.clearTimeout(fallbackId);
            hideLoader();
          }
        }

        window.__galatayoSetWelcomeReady = function () {
          isReady = true;
          tryHideLoader();
        };

        intervalId = window.setInterval(tryHideLoader, 50);

        function forceHideLoader() {
          window.clearInterval(intervalId);
          window.clearTimeout(fallbackId);
          hideLoader();
        }

        fallbackId = window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);

        if (document.readyState === 'complete') {
          window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);
          });
        }
      })();
    </script>
  </body>
</html>
