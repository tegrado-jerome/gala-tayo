<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var p = (location.pathname.replace(/\/+$/, '') || '/');
        if (p === '/') {
          document.documentElement.dataset.initialRoute = 'welcome';
          window.__galatayoWelcomeStart = Date.now();
          window.__galatayoWelcomeStartUsed = false;
        } else {
          document.documentElement.dataset.suppressLoader = 'true';
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preload" as="image" href="/images/brand/galatayo-logo-loader.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/welcome/mobile.webp" type="image/webp" media="(max-width: 639px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/welcome/tablet.webp" type="image/webp" media="(min-width: 640px) and (max-width: 1023px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/welcome/laptop-desktop.webp" type="image/webp" media="(min-width: 1024px)" fetchpriority="high" />

    <title>GalaTayo - Discover places in Metro Manila</title>
    <style>
      html, body, #root {
        min-height: 100vh;
      }

      html, body, #root {
        background: #f5f0e7;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #141311;
      }

      .critical-app-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #f5f0e7;
        color: #d6451b;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 560ms ease, visibility 560ms ease;
      }

      html[data-suppress-loader] .critical-app-loader {
        display: none !important;
      }

      .critical-app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .critical-app-loader__logo {
        display: block;
        width: clamp(260px, 62vw, 420px);
        height: auto;
        object-fit: contain;
        opacity: 0.96;
        animation: critical-logo-breathe 2.8s ease-in-out -1.4s infinite;
        will-change: transform, opacity;
        filter:
          drop-shadow(0 12px 26px rgba(15, 23, 42, 0.08))
          drop-shadow(0 0 6px rgba(255, 255, 255, 0.14));
      }

      @keyframes critical-logo-breathe {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.94;
          transform: scale(1.012);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .critical-app-loader__logo {
          animation-duration: 1ms;
          animation-iteration-count: 1;
        }
      }
    </style>
    <script>
      (function () {
        function normalizeThemeRoutePath(pathname) {
          return pathname.replace(/\/+$/, '') || '/';
        }

        function isForcedLightThemePath(pathname) {
          return normalizeThemeRoutePath(pathname) === '/';
        }

        try {
          var isForcedLightRoute = isForcedLightThemePath(window.location.pathname || '/');
          var storedPreference = localStorage.getItem('galatayo:theme-preference');
          var preference = storedPreference === 'dark' ? 'dark' : 'light';
          var resolvedTheme = isForcedLightRoute ? 'light' : preference;
          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="critical-welcome-loader" class="critical-app-loader" aria-label="Loading GalaTayo">
      <picture aria-hidden="true">
        <source srcset="/images/brand/galatayo-logo-loader.webp" type="image/webp" />
        <img class="critical-app-loader__logo" src="/images/brand/galatayo-logo-loader.png" alt="" width="840" height="360" fetchpriority="high" decoding="async" />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var isWelcome = (location.pathname.replace(/\/+$/, '') || '/') === '/';
        if (!isWelcome) return;

        var MIN_WELCOME_MS = 2000;
        var MAX_FALLBACK_MS = 10000;
        var start = window.__galatayoWelcomeStart || Date.now();
        var isReady = false;
        var intervalId = 0;
        var fallbackId = 0;

        function hideLoader() {
          var loader = document.getElementById('critical-welcome-loader');
          if (loader && !loader.classList.contains('is-hidden')) {
            loader.classList.add('is-hidden');
          }
        }

        function canHideLoader() {
          return isReady && (Date.now() - start >= MIN_WELCOME_MS);
        }

        function tryHideLoader() {
          if (canHideLoader()) {
            window.clearInterval(intervalId);
            window.clearTimeout(fallbackId);
            hideLoader();
          }
        }

        window.__galatayoSetWelcomeReady = function () {
          isReady = true;
          tryHideLoader();
        };

        intervalId = window.setInterval(tryHideLoader, 50);

        function forceHideLoader() {
          window.clearInterval(intervalId);
          window.clearTimeout(fallbackId);
          hideLoader();
        }

        fallbackId = window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);

        if (document.readyState === 'complete') {
          window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);
          });
        }
      })();
    </script>
  </body>
</html>
