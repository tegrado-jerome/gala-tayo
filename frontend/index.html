<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="dns-prefetch" href="//media.galatayo.app" />
    <link rel="preconnect" href="https://media.galatayo.app" />
    <link rel="preload" as="image" href="/images/welcome/mobile.webp" type="image/webp" media="(max-width: 639px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/welcome/tablet.webp" type="image/webp" media="(min-width: 640px) and (max-width: 1023px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/welcome/laptop-desktop.webp" type="image/webp" media="(min-width: 1024px)" fetchpriority="high" />
    <script>
      (function () {
        var pathname = window.location.pathname.replace(/\/+$/, '') || '/';

        if (pathname !== '/home') {
          return;
        }

        [
          'https://media.galatayo.app/places/space-time-cube/space-time-cube-1.webp',
          'https://media.galatayo.app/places/national-museum-of-fine-arts/national-museum-of-fine-arts-1.webp',
          'https://media.galatayo.app/places/ayala-malls-manila-bay/ayala-malls-manila-bay-1.webp',
        ].forEach(function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = href;
          link.fetchPriority = 'high';
          document.head.appendChild(link);
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="GalaTayo" />
    <meta name="apple-mobile-web-app-title" content="GalaTayo" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="description" content="Discover places across Metro Manila by city, category, budget, and vibe. Get AI-powered recommendations and plan your next gala." />
    <meta name="robots" content="index,follow,max-image-preview:none,max-snippet:-1,max-video-preview:-1" />
    <meta property="og:title" content="GalaTayo - Discover places in Metro Manila" />
    <meta property="og:description" content="Discover places across Metro Manila by city, category, budget, and vibe. Get AI-powered recommendations and plan your next gala." />
    <meta property="og:site_name" content="GalaTayo" />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="GalaTayo - Discover places in Metro Manila" />
    <meta name="twitter:description" content="Discover places across Metro Manila by city, category, budget, and vibe. Get AI-powered recommendations and plan your next gala." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>GalaTayo - Discover places in Metro Manila</title>
    <style>
      html, body, #root {
        background: #f8fafc;
        min-height: 100vh;
      }
    </style>
    <script>
      (function () {
        function normalizeThemeRoutePath(pathname) {
          return pathname.replace(/\/+$/, '') || '/';
        }

        function isForcedLightThemePath(pathname) {
          return normalizeThemeRoutePath(pathname) === '/';
        }

        try {
          var isForcedLightRoute = isForcedLightThemePath(window.location.pathname || '/');
          var storedPreference = localStorage.getItem('galatayo:theme-preference');
          var preference = storedPreference === 'dark' ? 'dark' : 'light';
          var resolvedTheme = isForcedLightRoute ? 'light' : preference;
          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
