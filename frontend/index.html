<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- Fix cascade-layer order before any stylesheet loads; a lazy chunk declaring `components` first would let the reset beat the kit. -->
    <style>@layer properties, theme, base, components, utilities;</style>
    <script>
      (function () {
        var p = (location.pathname.replace(/\/+$/, '') || '/');
        if (p === '/') {
          document.documentElement.dataset.initialRoute = 'welcome';
          window.__galatayoWelcomeStart = Date.now();
          window.__galatayoWelcomeStartUsed = false;
        } else {
          document.documentElement.dataset.suppressLoader = 'true';
        }
        // Home's LCP is the editor's pick photo (EDITORS_PICK in HomeDiscover.tsx); start it before the app bundle runs.
        // A prerendered page already has the <img> in its HTML, so only the bare app shell needs this.
        // heroPreload.test.ts keeps the URL in step with the photo the page really shows.
        if ((p === '/' || p === '/home') && !document.documentElement.hasAttribute('data-prerendered')) {
          var hero = 'https://media.galatayo.app/cdn-cgi/image/width=%W,quality=75,format=auto,onerror=redirect/places/fort-santiago/hd/fort-santiago-1-v2.webp';
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.setAttribute('imagesrcset', hero.replace('%W', '640') + ' 640w, ' + hero.replace('%W', '768') + ' 768w, ' + hero.replace('%W', '1280') + ' 1280w');
          link.setAttribute('imagesizes', '(min-width: 1240px) 1176px, calc(100vw - 32px)');
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }
      })();
    </script>

    <style>
      html, body, #root, #root-prerendered {
        min-height: 100vh;
      }

      html, body, #root, #root-prerendered {
        background: #ffffff;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root,
      html[data-theme="dark"] #root-prerendered {
        background: #111111;
      }

      /* main.tsx: the app renders here, unseen, until it can replace the prerendered page. */
      .app-booting {
        position: fixed;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        pointer-events: none;
      }

      .critical-app-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 560ms ease, visibility 560ms ease;
      }

      html[data-suppress-loader] .critical-app-loader,
      html[data-prerendered] .critical-app-loader {
        display: none !important;
      }

      .critical-app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .critical-app-loader__logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font: 600 34px/1 'Fraunces', Georgia, serif;
        letter-spacing: -0.04em;
        animation: critical-logo-breathe 2.4s ease-in-out infinite;
      }

      @keyframes critical-logo-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      @media (prefers-reduced-motion: reduce) {
        .critical-app-loader__logo { animation: none; }
      }
    </style>
    <script>
      (function () {
        try {
          // No saved choice follows the system setting (ThemeContext does the same).
          var storedPreference = localStorage.getItem('galatayo:theme-preference');
          var preference = storedPreference === 'dark' || storedPreference === 'light' ? storedPreference : 'system';
          var resolvedTheme = preference === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <script>
      (function () {
        var isWelcome = (location.pathname.replace(/\/+$/, '') || '/') === '/';
        if (!isWelcome) return;

        var MIN_WELCOME_MS = 600;
        var MAX_FALLBACK_MS = 10000;
        var start = window.__galatayoWelcomeStart || Date.now();
        var isReady = false;
        var intervalId = 0;
        var fallbackId = 0;

        function hideLoader() {
          var loader = document.getElementById('critical-welcome-loader');
          if (loader && !loader.classList.contains('is-hidden')) {
            loader.classList.add('is-hidden');
          }
        }

        function canHideLoader() {
          return isReady && (Date.now() - start >= MIN_WELCOME_MS);
        }

        function tryHideLoader() {
          if (canHideLoader()) {
            window.clearInterval(intervalId);
            window.clearTimeout(fallbackId);
            hideLoader();
          }
        }

        window.__galatayoSetWelcomeReady = function () {
          isReady = true;
          tryHideLoader();
        };

        intervalId = window.setInterval(tryHideLoader, 50);

        function forceHideLoader() {
          window.clearInterval(intervalId);
          window.clearTimeout(fallbackId);
          hideLoader();
        }

        fallbackId = window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);

        if (document.readyState === 'complete') {
          window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(forceHideLoader, MAX_FALLBACK_MS);
          });
        }
      })();
    </script>
  </body>
