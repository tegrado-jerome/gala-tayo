name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # Daily rebuild so new and edited places reach the sitemap, prerendered pages
  # and llms.txt without anyone pushing a commit.
  schedule:
    - cron: "0 20 * * *" # 4:00 AM Philippine time
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

# Production deploys queue so back-to-back merges all ship; only superseded PR previews are cancelled.
# PR runs get their own group: a merged PR's "closed" run reports ref=main and used to cancel the production deploy.
concurrency:
  group: azure-static-web-apps-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          npm run validate
          npm run test:unit
      - name: Generate static place listings
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: npm run generate:static-listings
      - name: Refresh sitemap
        working-directory: frontend
        run: |
          if curl -sf --max-time 120 "https://galatayo-api-cvawfwgrg6akdmem.southeastasia-01.azurewebsites.net/api/seo/sitemap.xml" -o sitemap.tmp && grep -q "<urlset" sitemap.tmp; then
            mv sitemap.tmp public/sitemap.xml
          else
            echo "::warning::Sitemap refresh failed; keeping committed sitemap.xml"
          fi
      # Built here instead of by the deploy action so the prerender step can use the runner's Chrome.
      - name: Build and prerender frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "https://galatayo-api-cvawfwgrg6akdmem.southeastasia-01.azurewebsites.net/api"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: "https://galatayo.app"
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.VITE_BING_SITE_VERIFICATION }}
          VITE_ADMIN_BASE_PATH: ${{ secrets.VITE_ADMIN_BASE_PATH }}
        run: |
          npm ci
          npm run validate
          npm run prerender
      # Crawler's-eye checks on dist/ (JSON-LD, titles, canonicals, OG, sitemap). Reported, not blocking.
      - name: SEO page checks
        continue-on-error: true
        working-directory: frontend
        env:
          VITE_SITE_URL: "https://galatayo.app"
        run: npm run seo:check
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_TREE_0B9F6DF00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
      # Tell IndexNow engines (Bing, Yandex, Seznam, Naver) which pages exist so
      # changes are recrawled quickly. Google reads the sitemap on its own.
      - name: Notify IndexNow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: frontend
        run: |
          node -e "
            const fs = require('fs');
            const urls = [...fs.readFileSync('dist/sitemap.xml', 'utf8').matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1].trim()).slice(0, 10000);
            fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({ host: 'galatayo.app', key: '70c28379c852580de89d3033d9fe287a', keyLocation: 'https://galatayo.app/70c28379c852580de89d3033d9fe287a.txt', urlList: urls }),
            }).then((r) => console.log('IndexNow', r.status, urls.length, 'urls'));
          "

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_TREE_0B9F6DF00 }}
          action: "close"

