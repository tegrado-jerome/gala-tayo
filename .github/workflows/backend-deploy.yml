name: Backend deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancel a backend deploy midway; queue the next one instead.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The Function App is a Windows Consumption plan running from a package,
    # so dependencies are installed here on Windows to match its platform.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build and test
        working-directory: backend
        run: |
          npm ci
          npm run validate
          npm run test:unit

      - name: Package
        working-directory: backend
        run: |
          npm prune --omit=dev
          mkdir -p ../deploy
          cp -r dist node_modules host.json package.json package-lock.json ../deploy/

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to galatayo-api
        uses: Azure/functions-action@v1
        with:
          app-name: galatayo-api
          package: deploy

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -sf --max-time 30 "https://galatayo-api-cvawfwgrg6akdmem.southeastasia-01.azurewebsites.net/api/health"; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::Backend health check failed after deploy"
          exit 1
