name: SEO daily trends

# Saves Google Trends searches in the Philippines that relate to going out in Metro Manila.
# When one is big (1,000+ searches) and matches a topic with enough places, it adds that guide
# the same day and redeploys, so fresh topics don't wait for the Monday job.
on:
  schedule:
    - cron: "0 23 * * *" # 7:00 AM Philippine time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect trends
        working-directory: frontend
        run: node scripts/seo/trends.mjs

      - name: Add a guide for a strong trend
        working-directory: frontend
        run: node scripts/seo/discover-guides.mjs --trending-only

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/scripts/seo/data frontend/src/data/seoGuides.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(seo): save daily trends"
          git pull --rebase
          git push
          if ! git diff --quiet HEAD~1 -- frontend/src/data/seoGuides.json; then
            # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
            gh workflow run azure-static-web-apps-kind-tree-0b9f6df00.yml --ref main
          fi
