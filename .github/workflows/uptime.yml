name: Uptime

# Every 10 minutes: is the site up and is the API healthy? On failure an issue labelled "uptime" is opened (GitHub
# emails the owner); while it stays down the issue gets at most one comment an hour; on recovery it is closed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: https://galatayo.app/
      HEALTH_URL: https://galatayo-api-cvawfwgrg6akdmem.southeastasia-01.azurewebsites.net/api/health?cache=1
    steps:
      - name: Check site and API
        run: |
          failures=""

          site_code=$(curl -sS -m 8 --retry 1 --retry-delay 2 -A "GalaTayo-uptime" -o site.html -w "%{http_code}" "$SITE_URL" 2>site.err || true)
          if [ "$site_code" != "200" ]; then
            failures+="- Site $SITE_URL returned HTTP ${site_code:-none} $(head -c 200 site.err)"$'\n'
          elif ! grep -q "GalaTayo" site.html; then
            failures+="- Site $SITE_URL returned 200 but the page does not contain \"GalaTayo\""$'\n'
          fi

          api_code=$(curl -sS -m 8 --retry 1 --retry-delay 2 -A "GalaTayo-uptime" -o health.json -w "%{http_code}" "$HEALTH_URL" 2>api.err || true)
          api_status=$(jq -r '.status // empty' health.json 2>/dev/null || true)
          if [ "$api_code" != "200" ] || [ "$api_status" != "ok" ]; then
            failures+="- API health returned HTTP ${api_code:-none}, status \"${api_status}\" $(head -c 200 api.err)"$'\n'
          fi

          now=$(date -u +"%Y-%m-%d %H:%M UTC")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open_issue=$(gh issue list --label uptime --state open --limit 1 --json number,updatedAt -q '.[] | "\(.number) \(.updatedAt)"')

          if [ -n "$failures" ]; then
            echo "::error::GalaTayo is down"
            printf '%s' "$failures"
            body=$(printf 'Uptime check failed at %s.\n\n%s\nRun: %s' "$now" "$failures" "$run_url")
            if [ -z "$open_issue" ]; then
              gh label create uptime --color B60205 --description "Opened by the uptime check" 2>/dev/null || true
              gh issue create --title "GalaTayo is down ($now)" --label uptime --body "$body"
            else
              read -r number updated_at <<<"$open_issue"
              if [ $(( $(date +%s) - $(date -d "$updated_at" +%s) )) -ge 3300 ]; then
                gh issue comment "$number" --body "Still down. $body"
              fi
            fi
          elif [ -n "$open_issue" ]; then
            read -r number _ <<<"$open_issue"
            gh issue close "$number" --comment "Back up at $now: site and API health both pass. Run: $run_url"
          else
            echo "Site and API are up."
          fi
