name: Weekly guides

# Every Monday: reads Search Console and GA4 (when the Google secret is set), adds up to 3
# /guides pages for the strongest search demand where GalaTayo has at least 6 real places,
# redeploys the site, and posts the week's SEO report as an issue.
on:
  schedule:
    - cron: "0 19 * * 0" # Monday 3:00 AM Philippine time
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEO_REPORT_PATH: /tmp/seo-report.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traffic report
        working-directory: frontend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: node scripts/seo/report.mjs

      - name: Find new guides
        working-directory: frontend
        run: node scripts/seo/discover-guides.mjs

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/seoGuides.json frontend/scripts/seo/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(seo): add weekly guides"
          git pull --rebase
          git push
          if ! git diff --quiet HEAD~1 -- frontend/src/data/seoGuides.json; then
            # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
            gh workflow run azure-static-web-apps-kind-tree-0b9f6df00.yml --ref main
          fi

      - name: Post weekly report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "SEO report $(date -u +%Y-%m-%d)" --body-file "$SEO_REPORT_PATH"
