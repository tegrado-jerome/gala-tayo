name: Weekly guides

# Adds up to 3 new /guides pages a week for searches people actually make (Google
# autocomplete) where GalaTayo has at least 6 real places, then redeploys the site.
on:
  schedule:
    - cron: "0 19 * * 0" # Monday 3:00 AM Philippine time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-guides
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find new guides
        working-directory: frontend
        run: node scripts/discover-guides.mjs

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- frontend/src/data/seoGuides.json; then
            echo "No new guides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/seoGuides.json
          git commit -m "feat(seo): add weekly guides"
          git push
          # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
          gh workflow run azure-static-web-apps-kind-tree-0b9f6df00.yml --ref main
